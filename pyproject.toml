[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextwalker"
version = "0.2.0"
description = "Local contextual, hybrid, and agentic RAG for PDF documents"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
authors = [{name = "ContextWalker Contributors"}]
keywords = [
    "agentic-rag",
    "bm25",
    "document-question-answering",
    "faiss",
    "ollama",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faiss-cpu",
    "langchain-text-splitters",
    "numpy",
    "pymupdf",
    "rank-bm25",
    "requests",
    "rich",
    "sentence-transformers",
]

[project.urls]
Homepage = "https://github.com/surya-d007/ContextWalker"
Documentation = "https://github.com/surya-d007/ContextWalker#readme"
Repository = "https://github.com/surya-d007/ContextWalker"
Issues = "https://github.com/surya-d007/ContextWalker/issues"

[project.scripts]
contextwalker = "contextwalker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
